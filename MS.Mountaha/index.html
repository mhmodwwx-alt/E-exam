<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miss Muntaha`s Exam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Dancing+Script:wght@700&display=swap"> 
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="login-card">
        <!-- logo -->
        <div class="logo-container">
            <!-- الحلقة الدوارة -->
            <div class="logo-ring"></div>
            <!-- الحلقة الوسطى -->
            <div class="logo-ring-inner"></div>
            <!-- الدائرة الرئيسية -->
            <div class="logo-circle">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <!-- نجوم للزينة -->
            <i class="fa-solid fa-star star star-1"></i> 
            <i class="fa-solid fa-star star star-2"></i> 
            <i class="fa-solid fa-star star star-3"></i> 
        </div> 
        <!-- العنوان -->
        <h1 class="min-title">Miss Muntaha`s Exam</h1> 
        <p class="sub-title-script">Welcome!</p>
        <p class="sub-title">
            <i class="fa-solid fa-heart"></i>
            Enter your info to begin
            <i class="fa-solid fa-heart"></i>
        </p>
        <!-- Form -->
        <form>
            <!-- Name -->
            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-user"></i>
                    Full Name
                </label>
                <input type="text" class="form-contrl"  placeholder="Enter your name....." required>
            </div> 
            <div class="form-row">
             <!-- Age -->
             <div>
                <label class="form-label">
                  <i class="fa-solid fa-cake-candles"></i>
                  Age
                </label>
                <input type="number" class="form-contrl" placeholder="e.g. 15" min="5" max="100" required>
             </div>
             <br>
             <!-- Grade -->
             <div>
                <label class="form-label">
                    <i class="fa-solid fa-book"></i>
                    School Stages
                </label>
                <input type="text" class="form-contrl" placeholder="9A / التاسع" required>
             </div> 
            </div>
            <a href="https://forms.gle/rM2F4ZCoEHBbj9zh6" class="btn-start" target="_blank">
                <i class="fa-solid fa-play"></i>
                Start Exam
            </a>
        </form> 
        <p class="footer-text">
            <i class="fa-solid fa-shield-halved"></i>
            Your info is safe with us
        </p>
    </div>
</body>
</html>
